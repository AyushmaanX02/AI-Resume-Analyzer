server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:resume_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  llm:
    provider: ${LLM_PROVIDER:anthropic}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-sonnet-4-6}
    api-url: https://api.anthropic.com/v1/messages

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

logging:
  level:
    com.ayushmaan.resumeanalyzer: DEBUG
